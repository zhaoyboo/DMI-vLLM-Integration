name: CPU and package gates

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m pip install --no-deps dist/*.whl
          python -c 'from importlib.metadata import distribution; from importlib.util import find_spec; d = distribution("DMI-vLLM-Integration"); eps = {(e.group, e.name) for e in d.entry_points}; assert d.version == "0.29.0"; assert ("vllm.general_plugins", "dmi_models") in eps; assert ("vllm.endpoint_plugins", "dmi_stop_monitoring") in eps; assert find_spec("dmi_vllm_integration.v2.worker") is not None'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  cpu:
    name: Official vLLM 0.29.0 / DMI ${{ matrix.dmi_ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dmi_ref:
          - v1.1.0
          - main
    env:
      DMI_VLLM_TEST_NATIVE_STUB: "1"
      NUMBA_DISABLE_JIT: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProjectDMX/DMI
          ref: ${{ matrix.dmi_ref }}
          path: .ci/dmi
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned DMI API, official vLLM, and this checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'vllm==0.29.0' pytest
          python -m pip install --no-deps --editable .ci/dmi
          python -m pip install --no-deps --editable .
      - name: Confirm the official runtime boundary
        run: |
          python -c 'from importlib.metadata import version; import pathlib, vllm; assert version("vllm") == "0.29.0"; assert "dmi_vllm_integration" not in pathlib.Path(vllm.__file__).parts'
      - name: Run portable CPU integration tests
        run: |
          python -m compileall -q src tests tests_v2
          python -m pytest -q -m "not gpu and not clickhouse and not e2e and not slow"
      - name: Run isolated V2 and worker-selection contracts
        run: |
          python -m pytest -q tests_v2/test_worker_selector.py tests_v2/test_v2_adapter.py
